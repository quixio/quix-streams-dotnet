name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'


# Run only one workflow per PR or commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Disable default permissions for all jobs
permissions: { }

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: true
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  test-dotnet:
    permissions:
      contents: read # to fetch code (actions/checkout)
    name: Run C# tests in Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run C# tests
        run: make test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/**/*.trx
            test-results/**/Sequence_*.xml
          if-no-files-found: ignore

  build-dotnet:
    permissions:
      contents: read # to fetch code (actions/checkout)
    name: Build C# NuGets in Docker
    runs-on: ubuntu-latest
    needs: test-dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build NuGets
        run: make package
      - name: Upload NuGets
        uses: actions/upload-artifact@v4
        with:
          name: linux-docker-nugets
          path: |
            builds/csharp/nuget/build-result/*.nupkg
          if-no-files-found: error
